# CyberFleet 2026 - hierarhiline Ansible'i inventar

[controller]
hq-controller ansible_connection=local

[vault]
backup-vault

[workstations]
ws-dev-01
ws-fin-01

[servers]
srv-app-01

[kiosks]
kiosk-lobby

[iot]
iot-sensor-1
iot-cam-1

# --- võrgutsoonide grupid ---
[mgmt_zone:children]
controller
vault

[corp_zone:children]
workstations
servers

[dmz_zone:children]
kiosks
iot

# --- kõik hallatavad sõlmed (ilma kontrollerita) ---
[managed:children]
vault
workstations
servers
kiosks
iot

[all:vars]
ansible_user=root
ansible_ssh_private_key_file=/root/.ssh/id_ed25519
