[defaults]
inventory = /ansible/hosts.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
forks = 8
deprecation_warnings = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=30s -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
pipelining = True
